 <p style=\"margin-top:16px;font-size:18px;line-height:1.65;color:#E2DFD8;max-width:52ch;text-wrap:pretty\">Öffnen Sie den Weg, der zu Ihrem Vorhaben passt. Jeder Weg beschreibt, was enthalten ist, wie wir vorgehen und worauf Sie sich verlassen können.<\u002Fp>\n  <a href=\"#kontakt\" style=\"margin-top:24px;display:inline-flex;align-items:center;gap:16px;min-height:48px;font-size:15px;font-weight:500\">Ihr Vorhaben mit uns besprechen<span aria-hidden=\"true\" style=\"color:#C4B394\">→<\u002Fspan><\u002Fa>\n  <img src=\"370e26e9-bd80-450b-ae38-3744e3ec2642\" width=\"1630\" height=\"965\" alt=\"Pascal Courbois mit NeX und AIFly ORACLE zeigt die NeXify-AI-App – Chat it. Automate it.\" loading=\"lazy\" style=\"margin-top:40px;width:100%;height:auto;max-width:680px;display:block\">\n <\u002Fheader>\n <div style=\"display:grid;gap:16px;min-width:0\">\n  <sc-for list=\"{{ offers }}\" as=\"o\" hint-placeholder-count=\"3\">\n   <div style=\"border-radius:28px;padding:28px 32px;background:linear-gradient(145deg,rgba(189,197,201,.08),transparent 45%),rgba(30,33,34,.91);box-shadow:{{ o.shadow }};transition:box-shadow .24s\">\n    <button type=\"button\" sc-camel-on-click=\"{{ o.toggle }}\" aria-expanded=\"{{ o.expanded }}\" style=\"width:100%;display:flex;gap:24px;align-items:center;justify-content:space-between;min-height:48px;padding:0;border:0;background:none;text-align:left;cursor:pointer\">\n     <span style=\"min-width:0\"><strong style=\"display:block;font:500 24px/1.35 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;color:#F3F0EA\">{{ o.title }}<\u002Fstrong><span style=\"display:block;margin-top:12px;font-size:16px;line-height:1.65;color:#E2DFD8;max-width:48ch\">{{ o.lead }}<\u002Fspan><\u002Fspan>\n     <svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#C4B394\" stroke-width=\"1.5\" aria-hidden=\"true\" style=\"flex:none;transform:{{ o.rotate }};transition:transform .24s\"><path d=\"M5 12h14m-7-7v14\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <sc-if value=\"{{ o.open }}\" hint-placeholder-val=\"{{ false }}\">\n     <div style=\"padding-top:24px;animation:hcRise .3s ease both\">\n      <ul style=\"list-style:disc;padding-left:24px\">\n       <sc-for list=\"{{ o.items }}\" as=\"it\" hint-placeholder-count=\"3\"><li style=\"padding-left:8px;margin-bottom:12px;font-size:16px;line-height:1.65;color:#E2DFD8\">{{ it }}<\u002Fli><\u002Fsc-for>\n      <\u002Ful>\n      <p style=\"margin-top:12px;font-size:15px;line-height:1.65;color:#B9BBBA;max-width:62ch\">{{ o.caption }}<\u002Fp>\n      <a href=\"{{ o.href }}\" style=\"margin-top:16px;display:inline-flex;align-items:center;gap:16px;min-height:48px;font-size:15px;font-weight:500\">Leistung und Umfang ansehen<span aria-hidden=\"true\" style=\"color:#C4B394\">→<\u002Fspan><\u002Fa>\n     <\u002Fdiv>\n    <\u002Fsc-if>\n   <\u002Fdiv>\n  <\u002Fsc-for>\n <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 · ZUSAMMENARBEIT -->\n<section id=\"zusammenarbeit\" data-screen-label=\"05 Zusammenarbeit\" aria-labelledby=\"hc-process-title\" style=\"max-width:1680px;margin:0 auto;padding:64px clamp(20px,4.5cqi,80px)\">\n <header style=\"margin-bottom:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(24px,4cqi,64px);align-items:center\">\n  <div style=\"min-width:0\">\n   <span style=\"display:block;margin-bottom:16px;color:#C4B394;font-size:15px;font-weight:500\">So arbeiten wir zusammen<\u002Fspan>\n   <h2 id=\"hc-process-title\" style=\"font:500 clamp(32px,3.5cqi,48px)/1.15 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:16ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Ein Ansprechpartner vom ersten Gespräch bis zur Übergabe.<\u002Fh2>\n   <p style=\"margin-top:16px;font-size:18px;line-height:1.65;color:#E2DFD8;max-width:52ch;text-wrap:pretty\">Pascal betreut Ihr Projekt selbst. Sie sehen früh, in welche Richtung es geht, was im Umfang enthalten ist und wann Ihre Entscheidung gebraucht wird.<\u002Fp>\n  <\u002Fdiv>\n  <img src=\"49610b60-b005-4b1c-8d75-7ddaaafe75ab\" width=\"1630\" height=\"965\" alt=\"Pascal Courbois an seinem NeXify-Schreibtisch mit Laptop und NeXify-AI-Tasse\" loading=\"lazy\" style=\"width:100%;height:auto;max-width:760px;justify-self:end;display:block\">\n <\u002Fheader>\n \n <ol style=\"list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(16px,2.4cqi,48px)\">\n  <li style=\"min-width:0;padding:24px;border-radius:20px;background:linear-gradient(145deg,rgba(189,197,201,.06),transparent 45%),rgba(30,33,34,.6);box-shadow:inset 0 1px 0 rgba(189,197,201,.1)\"><h3 style=\"font:500 24px/1.35 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:20ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Wir verstehen, was Sie erreichen möchten.<\u002Fh3><p style=\"margin-top:16px;font-size:16px;line-height:1.65;color:#E2DFD8;text-wrap:pretty\">Wir sprechen über Ihr Angebot, Ihre Kunden, die bisherige Lösung und den Maßstab, an dem das Ergebnis bestehen muss.<\u002Fp><\u002Fli>\n  <li style=\"min-width:0;padding:24px;border-radius:20px;background:linear-gradient(145deg,rgba(189,197,201,.06),transparent 45%),rgba(30,33,34,.6);box-shadow:inset 0 1px 0 rgba(189,197,201,.1)\"><h3 style=\"font:500 24px/1.35 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:20ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Sie erhalten einen klaren Leistungsrahmen.<\u002Fh3><p style=\"margin-top:16px;font-size:16px;line-height:1.65;color:#E2DFD8;text-wrap:pretty\">Leistungen, Mitwirkung, Termine, sinnvolle Optionen und Kosten werden verständlich voneinander getrennt.<\u002Fp><\u002Fli>\n  <li style=\"min-width:0;padding:24px;border-radius:20px;background:linear-gradient(145deg,rgba(189,197,201,.06),transparent 45%),rgba(30,33,34,.6);box-shadow:inset 0 1px 0 rgba(189,197,201,.1)\"><h3 style=\"font:500 24px/1.35 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:20ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Konzept, Text und Design entstehen gemeinsam.<\u002Fh3><p style=\"margin-top:16px;font-size:16px;line-height:1.65;color:#E2DFD8;text-wrap:pretty\">An festen Terminen sehen Sie den Stand als Ganzes und entscheiden, wie es weitergeht.<\u002Fp><\u002Fli>\n  <li style=\"min-width:0;padding:24px;border-radius:20px;background:linear-gradient(145deg,rgba(189,197,201,.06),transparent 45%),rgba(30,33,34,.6);box-shadow:inset 0 1px 0 rgba(189,197,201,.1)\"><h3 style=\"font:500 24px/1.35 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:20ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Wir prüfen, übergeben und bleiben erreichbar.<\u002Fh3><p style=\"margin-top:16px;font-size:16px;line-height:1.65;color:#E2DFD8;text-wrap:pretty\">Das vereinbarte Ergebnis wird geprüft und nachvollziehbar übergeben. Pflege und Weiterentwicklung können Sie passend ergänzen.<\u002Fp><\u002Fli>\n <\u002Fol>\n<\u002Fsection>\n\n<!-- 08 · BUDGET -->\n<section id=\"budget\" data-screen-label=\"08 Budget\" aria-labelledby=\"hc-budget-title\" style=\"max-width:1680px;margin:0 auto;padding:64px clamp(20px,4.5cqi,80px)\">\n <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(32px,4cqi,64px);align-items:start\">\n  <header>\n   <span style=\"display:block;margin-bottom:16px;color:#C4B394;font-size:15px;font-weight:500\">Budget mit nachvollziehbarer Grundlage<\u002Fspan>\n   <h2 id=\"hc-budget-title\" style=\"font:500 clamp(32px,3.5cqi,48px)/1.15 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:22ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Hochwertige Arbeit zu einem Preis, den Sie vorher kennen.<\u002Fh2>\n   <p style=\"margin-top:16px;font-size:18px;line-height:1.65;color:#E2DFD8;max-width:52ch;text-wrap:pretty\">Bei uns gibt es keine unklaren Agenturpakete. Wir rechnen mit einem festen Tagessatz. Vor dem Start erhalten Sie einen klar beschriebenen Umfang und entscheiden selbst, was jetzt umgesetzt wird und was später kommt.<\u002Fp>\n   <div role=\"group\" aria-label=\"449 € netto je Projekttag\" style=\"position:relative;margin-top:32px;padding:32px;overflow:hidden;border-radius:28px;background:linear-gradient(145deg,rgba(189,197,201,.08),transparent 45%),rgba(30,33,34,.91);box-shadow:inset 0 1px 0 rgba(189,197,201,.32),inset 1px 0 0 rgba(196,179,148,.12),0 0 0 1px rgba(255,255,255,.04),0 24px 64px -32px rgba(0,0,0,.9)\">\n    <div aria-hidden=\"true\" style=\"position:absolute;inset:-55% -15% 40% 25%;pointer-events:none;background:radial-gradient(ellipse,rgba(196,179,148,.18),transparent 68%);filter:blur(20px)\"><\u002Fdiv>\n    <span style=\"position:relative;display:block;color:#E2DFD8;font-size:14px\">Klare Kalkulationsbasis<\u002Fspan>\n    <strong style=\"position:relative;display:block;margin-block:8px;font:500 clamp(2.5rem,5cqi,4.8rem)/1.1 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">449 €<\u002Fstrong>\n    <small style=\"position:relative;display:block;color:#E2DFD8;font-size:14px\">netto je Projekttag<\u002Fsmall>\n    <p style=\"position:relative;margin-top:16px;font-size:14px;line-height:1.65;color:#E2DFD8;max-width:46ch\">Konzept, Text, Design und technische Umsetzung werden nach dem vereinbarten Umfang geplant. Externe Kosten weisen wir separat aus.<\u002Fp>\n   <\u002Fdiv>\n   <a href=\"#preise-ablauf\" style=\"margin-top:24px;display:inline-flex;align-items:center;gap:16px;min-height:48px;font-size:15px;font-weight:500\">Mehr zu Preisen und Zusammenarbeit<span aria-hidden=\"true\" style=\"color:#C4B394\">→<\u002Fspan><\u002Fa>\n  <\u002Fheader>\n  <div style=\"display:grid;gap:32px;padding:32px;border-radius:28px;background:linear-gradient(145deg,rgba(189,197,201,.08),transparent 45%),rgba(30,33,34,.91);box-shadow:inset 0 1px 0 rgba(189,197,201,.16),0 0 0 1px rgba(255,255,255,.04),0 24px 64px -32px rgba(0,0,0,.9)\">\n   <div><h3 style=\"font:500 18px/1.35 'Plus Jakarta Sans',sans-serif\">Alles, was wir entwickeln<\u002Fh3><p style=\"margin-top:12px;font-size:16px;line-height:1.65;color:#E2DFD8;text-wrap:pretty\">Konzept, Text, Design und technische Umsetzung werden im Angebot einem konkreten Ergebnis zugeordnet.<\u002Fp><\u002Fdiv>\n   <div><h3 style=\"font:500 18px/1.35 'Plus Jakarta Sans',sans-serif\">Alles, was danach bleibt<\u002Fh3><p style=\"margin-top:12px;font-size:16px;line-height:1.65;color:#E2DFD8;text-wrap:pretty\">Pflege, Weiterentwicklung und persönliche Unterstützung werden als eigener, nachvollziehbarer Baustein vereinbart.<\u002Fp><\u002Fdiv>\n   <div><h3 style=\"font:500 18px/1.35 'Plus Jakarta Sans',sans-serif\">Alles, was extern anfällt<\u002Fh3><p style=\"margin-top:12px;font-size:16px;line-height:1.65;color:#E2DFD8;text-wrap:pretty\">Hosting, Software, KI-Nutzung sowie Medien- und Werbebudget stehen als eigene Posten im Angebot.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n <\u002Fdiv>\n <!-- Erweiterung · Rechenbeispiel aus vorhandener Copy -->\n <div style=\"margin-top:48px\">\n  <div style=\"position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,rgba(189,197,201,.08),transparent 45%),rgba(30,33,34,.68);box-shadow:inset 0 1px 0 rgba(189,197,201,.18),0 0 0 1px rgba(255,255,255,.05),0 24px 64px -40px rgba(0,0,0,.9)\">\n   <div aria-hidden=\"true\" style=\"position:absolute;inset:-50% 35% 50% -12%;pointer-events:none;background:radial-gradient(ellipse,rgba(196,179,148,.16),transparent 70%);filter:blur(30px)\"><\u002Fdiv>\n   <button type=\"button\" sc-camel-on-click=\"{{ toggleCalc }}\" aria-expanded=\"{{ calcExpanded }}\" style=\"position:relative;width:100%;display:flex;align-items:center;gap:20px;padding:22px clamp(20px,2.4cqi,28px);border:0;background:none;text-align:left;cursor:pointer\">\n    <span aria-hidden=\"true\" style=\"position:relative;flex:none;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(ellipse 120% 120% at 30% 20%,rgba(196,179,148,.22),rgba(25,27,28,.92));animation:nxPing 3.4s ease-out infinite\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#C4B394\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2.5\"><\u002Frect><path d=\"M8 7h8\"><\u002Fpath><path d=\"M8 15h0M12 15h0M16 15v2M8 19h4\"><\u002Fpath><path d=\"M8 11h0M12 11h0M16 11h0\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <span style=\"min-width:0;display:flex;flex-direction:column;gap:5px\"><span style=\"font:500 11px/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#C4B394\">Interaktiv · Rechenbeispiel<\u002Fspan><strong style=\"font:500 clamp(19px,1.5cqi,22px)/1.25 'Plus Jakarta Sans',sans-serif;letter-spacing:-.03em;color:#F3F0EA\">Wie eine Kalkulation entsteht<\u002Fstrong><span style=\"font-size:14px;line-height:1.5;color:#B9BBBA;text-wrap:pretty\">Spielen Sie ein Beispiel mit eigenen Zahlen durch — in Sekunden, unverbindlich.<\u002Fspan><\u002Fspan>\n    <span aria-hidden=\"true\" style=\"flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:999px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#C4B394;transform:{{ calcRotate }};transition:transform .28s cubic-bezier(.2,.8,.3,1)\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n   <\u002Fbutton>\n   <sc-if value=\"{{ calcCollapsed }}\" hint-placeholder-val=\"{{ true }}\">\n    <div aria-hidden=\"true\" style=\"position:relative;margin:0 clamp(20px,2.4cqi,28px);padding:16px 0 24px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:baseline;gap:16px;-webkit-mask-image:linear-gradient(180deg,#000 35%,transparent);mask-image:linear-gradient(180deg,#000 35%,transparent);opacity:.7\"><span style=\"font-size:13px;color:#B9BBBA\">Beispiel-Projektpreis netto<\u002Fspan><span style=\"font:500 24px/1 'Plus Jakarta Sans',sans-serif;color:#C4B394;font-variant-numeric:tabular-nums\">{{ calcResult }}<\u002Fspan><\u002Fdiv>\n   <\u002Fsc-if>\n   <sc-if value=\"{{ calcOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;padding:4px clamp(20px,2.4cqi,28px) 32px;animation:hcRise .34s cubic-bezier(.2,.8,.3,1) both\">\n    <p style=\"font-size:15px;line-height:1.65;color:#E2DFD8;max-width:65ch\">Reines Rechenbeispiel mit angenommenen Kosten. Kein NeXify-Tarif und kein verbindliches Angebot. Alle Beträge netto; Steuern werden im konkreten Angebot bestimmt.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:24px;margin-block:24px\">\n     <sc-for list=\"{{ calcFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n      <label style=\"display:grid;gap:12px;min-width:0;font-size:15px;color:#E2DFD8\">{{ f.label }}<input type=\"number\" inputmode=\"decimal\" min=\"0\" value=\"{{ f.value }}\" sc-camel-on-input=\"{{ f.set }}\" style=\"min-width:0;width:100%;min-height:48px;padding:12px 16px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#191B1C;color:#F3F0EA;font-variant-numeric:tabular-nums\" style-hover=\"border-color:#C4B394\"><\u002Flabel>\n     <\u002Fsc-for>\n    <\u002Fdiv>\n    <div aria-live=\"polite\" style=\"display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;padding-block:24px;border-top:1px solid rgba(255,255,255,.08)\">\n     <span style=\"font-size:16px;color:#E2DFD8\">Beispiel-Projektpreis netto<\u002Fspan>\n     <output style=\"font:500 clamp(32px,3.5cqi,48px)/1.2 'Plus Jakarta Sans',sans-serif;color:#C4B394;font-variant-numeric:tabular-nums\">{{ calcResult }}<\u002Foutput>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;line-height:1.65;color:#B9BBBA\">Vollkosten ÷ (1 − Umsatzmarge). Ein Kostenaufschlag wird anders gerechnet.<\u002Fp>\n    <\u002Fdiv>\n   <\u002Fsc-if>\n  <\u002Fdiv>\n <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 · PRODUKTWELT -->\n<section id=\"produktwelt\" data-screen-label=\"06 Produktwelt\" aria-labelledby=\"hc-products-title\" style=\"max-width:1680px;margin:0 auto;padding:64px clamp(20px,4.5cqi,80px)\">\n <header style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(24px,4cqi,64px);align-items:center;margin-bottom:32px\">\n  <div><span style=\"display:block;margin-bottom:16px;color:#C4B394;font-size:15px;font-weight:500\">Mehr von NeXify<\u002Fspan><h2 id=\"hc-products-title\" style=\"font:500 clamp(32px,3.5cqi,48px)/1.15 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:20ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Produkte, die Ihr Projekt ergänzen – wenn sie passen.<\u002Fh2><\u002Fdiv>\n  <p style=\"font-size:18px;line-height:1.65;color:#E2DFD8;max-width:52ch;text-wrap:pretty\">Neben Kundenprojekten entwickelt NeXify eigene Produkte für Wissen, Aufgaben, Integrationen und den Fahrzeugbereich. Wir setzen sie in Ihrem Projekt nur ein, wenn sie Ihnen tatsächlich weiterhelfen.<\u002Fp>\n <\u002Fheader>\n <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px\">\n  <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"4\">\n   <a href=\"{{ p.href }}\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:24px;min-width:0;padding:32px;border-radius:28px;color:#F3F0EA;background:linear-gradient(145deg,rgba(189,197,201,.08),transparent 45%),rgba(30,33,34,.91);box-shadow:inset 0 1px 0 rgba(189,197,201,.16),0 0 0 1px rgba(255,255,255,.04),0 24px 64px -32px rgba(0,0,0,.9);transition:box-shadow .24s,transform .24s\" style-hover=\"color:#F3F0EA;transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(189,197,201,.32),inset 1px 0 0 rgba(196,179,148,.12),0 0 0 1px rgba(196,179,148,.18),0 24px 64px -32px rgba(0,0,0,.9)\">\n    <div style=\"min-width:0\"><h3 style=\"font:500 24px/1.35 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em\">{{ p.title }}<\u002Fh3><p style=\"margin:16px 0;font-size:16px;line-height:1.65;color:#E2DFD8;max-width:52ch\">{{ p.body }}<\u002Fp><span style=\"font-size:15px;font-weight:500\">{{ p.action }}<\u002Fspan><\u002Fdiv>\n    <span aria-hidden=\"true\" style=\"flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:999px;background:#242728;box-shadow:inset 0 1px 0 rgba(189,197,201,.2)\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#C4B394\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 19 19 5M5 5h14v14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n   <\u002Fa>\n  <\u002Fsc-for>\n <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fdiv>\n\n<!-- ================= CHAT RECHTS · Struktur unverändert ================= -->\n<aside id=\"chat\" data-screen-label=\"Chat\" aria-label=\"NeX Agentic AIFly\" style=\"flex:0 0 clamp(360px,28vw,440px);padding:16px 16px 0;background:linear-gradient(180deg,#1B1D1E,#161718)\">\n <div style=\"position:sticky;top:16px;display:flex;flex-direction:column;height:calc(100vh - 16px);border-radius:28px 28px 0 0;background:linear-gradient(180deg,#1B1D1E,#161718);box-shadow:inset 0 1px 0 rgba(189,197,201,.16),0 0 0 1px rgba(255,255,255,.08);overflow:hidden\">\n  <div style=\"display:flex;align-items:center;gap:14px;padding:18px 20px 16px 14px\">\n   <span style=\"position:relative;flex:none;width:76px;height:76px;display:grid;place-items:center\"><span aria-hidden=\"true\" style=\"position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(192,238,56,.28),transparent 68%);filter:blur(8px)\"><\u002Fspan><img src=\"73cb9673-c79a-4a1c-9c65-5305ec16c1a7\" alt=\"\" width=\"76\" height=\"76\" style=\"position:relative;display:block;width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))\"><\u002Fspan>\n   <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 20px/1.2 'Plus Jakarta Sans',sans-serif;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">NeX Agentic AIFly<\u002Fspan><span style=\"font-size:14px;color:#B9BBBA\">NeXify AI<\u002Fspan><\u002Fspan>\n   <button type=\"button\" sc-camel-on-click=\"{{ toggleChat }}\" aria-label=\"{{ chatToggleLabel }}\" aria-expanded=\"{{ chatExpandedAttr }}\" style=\"flex:none;width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:999px;background:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.12);cursor:pointer\" style-hover=\"background:#242728\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#F3F0EA\" stroke-width=\"1.5\" aria-hidden=\"true\" style=\"transform:{{ chatChevron }};transition:transform .24s\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ chatExpanded }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column\">\n   <div style=\"flex:none;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px\">\n    <div data-testid=\"chat-intro\" style=\"position:{{ chatPin }};top:0;z-index:2;margin:-4px -16px 0;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#1B1D1E calc(100% - 20px),rgba(27,29,30,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(255,255,255,.05),0 16px 24px -18px rgba(0,0,0,.6)\"><span style=\"font-size:14px;font-weight:500;color:#C0EE38\">Leistungen finden<\u002Fspan>\n    <h2 style=\"font:500 clamp(28px,2vw,34px)/1.15 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;padding-bottom:.08em\">Was haben Sie vor?<\u002Fh2>\n    <p style=\"font-size:16px;line-height:1.6;color:#E2DFD8;margin-bottom:0\">Beschreiben Sie kurz Ihr Vorhaben oder wählen Sie einen Bereich. Hier finden Sie passende Informationen und den Weg zum persönlichen Gespräch.<\u002Fp><\u002Fdiv>\n    <sc-for list=\"{{ chatOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n     <button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" aria-pressed=\"{{ c.pressed }}\" style=\"display:grid;grid-template-columns:30px minmax(0,1fr) 20px;gap:14px;align-items:center;width:100%;min-height:84px;padding:14px 16px;border:0;border-radius:16px;background:{{ c.bg }};box-shadow:{{ c.ring }};text-align:left;cursor:pointer;transition:background .2s,box-shadow .2s\" style-hover=\"background:#242728\">\n      <span style=\"font:500 12px 'Geist Mono',monospace;color:#B9BBBA\">{{ c.num }}<\u002Fspan>\n      <span style=\"min-width:0;display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px;font-weight:600;color:#F3F0EA\">{{ c.label }}<\u002Fstrong><span style=\"font-size:13px;line-height:1.5;color:#CBD1D6\">{{ c.desc }}<\u002Fspan><\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CBD1D6\">→<\u002Fspan>\n     <\u002Fbutton>\n    <\u002Fsc-for>\n    <div style=\"margin-top:2px;padding:16px;border-radius:16px;background:radial-gradient(ellipse 80% 70% at 50% 0%,rgba(192,238,56,.09),transparent 70%),#1D2021;box-shadow:inset 0 1px 0 rgba(189,197,201,.14),0 0 0 1px rgba(255,255,255,.06)\">\n     <span style=\"display:block;font-size:13px;font-weight:500;color:#C0EE38\">Persönlich geführt<\u002Fspan>\n     <h3 style=\"margin-top:8px;font:500 21px/1.25 'Plus Jakarta Sans',sans-serif;letter-spacing:-.03em\">Aus einer Idee wird ein klarer nächster Schritt.<\u002Fh3>\n     <p style=\"margin-top:10px;font-size:14px;line-height:1.6;color:#E2DFD8\">AIFly ordnet Ihr Vorhaben vor. Pascal übernimmt, sobald Ziele, Umfang und Entscheidungen persönlich geklärt werden sollen.<\u002Fp>\n     <ol style=\"list-style:none;padding:12px 0 0;margin-top:12px;border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n      <li style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font:500 11px 'Geist Mono',monospace;color:#C0EE38\">01<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;line-height:1.35\">Vorhaben einordnen<\u002Fspan><\u002Fli>\n      <li style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font:500 11px 'Geist Mono',monospace;color:#C0EE38\">02<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;line-height:1.35\">Passenden Weg finden<\u002Fspan><\u002Fli>\n      <li style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font:500 11px 'Geist Mono',monospace;color:#C0EE38\">03<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;line-height:1.35\">Persönlich vertiefen<\u002Fspan><\u002Fli>\n     <\u002Fol>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n     <div role=\"status\" style=\"padding:14px 16px;border-radius:16px;background:#1D2021;box-shadow:inset 0 0 0 1px rgba(196,179,148,.24);animation:hcRise .3s ease both\"><span style=\"display:block;font-size:11px;font-weight:500;color:#C4B394\">{{ noteKicker }}<\u002Fspan><p style=\"margin-top:6px;font-size:13px;line-height:1.55;color:#E2DFD8\">{{ noteText }}<\u002Fp><\u002Fdiv>\n    <\u002Fsc-if>\n   <\u002Fdiv>\n   <div data-testid=\"chat-composer-area\" style=\"position:{{ chatPin }};bottom:0;z-index:2;margin-top:auto;flex:none;background:linear-gradient(180deg,rgba(22,23,24,.92),#161718 24px);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -1px 0 rgba(255,255,255,.06),0 -16px 32px -16px rgba(0,0,0,.6)\">\n   <form sc-camel-on-submit=\"{{ submitChat }}\" style=\"flex:none;padding:16px 16px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:10px;background:radial-gradient(ellipse 70% 60% at 50% 100%,rgba(192,238,56,.06),transparent 70%)\">\n    <label for=\"chat-input\" style=\"font-size:16px;font-weight:500;color:#F3F0EA\">Wobei können wir Ihnen helfen?<\u002Flabel>\n    <textarea id=\"chat-input\" rows=\"2\" data-testid=\"chat-composer-textarea\" value=\"{{ chatText }}\" sc-camel-on-input=\"{{ setChatText }}\" placeholder=\"Zum Beispiel: Ich möchte meine Website erneuern …\" style=\"width:100%;padding:14px;border:0;border-radius:14px;background:#111212;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:15px;line-height:1.5;resize:none;max-height:25vh\" style-focus=\"box-shadow:inset 0 0 0 1px #C4B394;outline:none\"><\u002Ftextarea>\n    <button type=\"submit\" style=\"display:flex;justify-content:center;align-items:center;gap:12px;min-height:52px;border:0;border-radius:14px;background:#191B1C;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#242728\">Informationen anzeigen<span aria-hidden=\"true\">→<\u002Fspan><\u002Fbutton>\n    <small style=\"text-align:center;font-size:13px;color:#B9BBBA\">NeX Agentic AIFly kann Fehler machen.<\u002Fsmall>\n   <\u002Fform>\n   <a href=\"#kontakt\" style=\"flex:none;margin:12px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.06);color:#F3F0EA\" style-hover=\"color:#F3F0EA;background:#1D2021\"><span style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:13px;color:#C0EE38\">Nächster Schritt<\u002Fspan><span style=\"font-size:16px;font-weight:600\">Ihr Vorhaben konkretisieren<\u002Fspan><\u002Fspan><span aria-hidden=\"true\" style=\"flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.14)\">→<\u002Fspan><\u002Fa>\n   <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n <\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n\n<!-- ================= FOOTER · Struktur unverändert ================= -->\n<footer id=\"kontakt\" data-screen-label=\"Footer\" style=\"container-type:inline-size;background:radial-gradient(ellipse at 85% 5%,rgba(196,179,148,.07),transparent 58%),#191B1C;color:#E2DFD8\">\n <div style=\"max-width:1680px;margin:0 auto;padding:64px clamp(20px,4.5vw,80px) 24px\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px 48px;margin-bottom:64px\">\n   <div style=\"max-width:60ch\"><h2 style=\"font:500 clamp(32px,3.5cqi,48px)/1.15 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;max-width:26ch;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;background:linear-gradient(115deg,#F3F0EA 8%,#C4B394 62%,#BDC5C9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em\">Lassen Sie uns über Ihr Vorhaben sprechen.<\u002Fh2><p style=\"margin-top:16px;font-size:18px;line-height:1.65;max-width:42ch\">Erzählen Sie uns, was Sie verändern möchten. Wir klären gemeinsam den passenden nächsten Schritt.<\u002Fp><\u002Fdiv>\n   <a href=\"#kontakt\" style=\"flex:none;display:inline-flex;align-items:center;gap:24px;min-height:52px;padding:14px 24px;border-radius:999px;background:linear-gradient(180deg,#DBF68A,#C0EE38 55%,#A6D820);color:#0A0C10;font-weight:600;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 16px 36px -14px rgba(192,238,56,.5)\" style-hover=\"color:#0A0C10;filter:brightness(1.05)\">Projekt besprechen<svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M5 19 19 5M5 5h14v14\"><\u002Fpath><\u002Fsvg><\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:32px;padding-bottom:48px\">\n   <div style=\"display:flex;flex-direction:column;gap:20px;max-width:36ch\">\n    <span style=\"display:flex;align-items:center;gap:10px;white-space:nowrap\"><img src=\"60a0e1c2-4003-4b39-b468-cb86cc2d002c\" alt=\"\" width=\"30\" height=\"30\"><span style=\"display:flex;flex-direction:column;line-height:1\"><span style=\"font:700 22px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-.03em;color:#fff\">Ne<span style=\"color:#C0EE38\">X<\u002Fspan>ify <span style=\"color:#C0EE38\">AI<\u002Fspan><\u002Fspan><span style=\"font-size:11px;font-weight:500;margin-top:4px\">Chat it. Automate it.<\u002Fspan><\u002Fspan><\u002Fspan>\n    <p style=\"font-size:16px;line-height:1.65\">Websites, digitale Abläufe und Kampagnen für Ihr Unternehmen. Persönlich begleitet von Pascal Courbois.<\u002Fp>\n    <a href=\"#kontakt\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600;color:#C0EE38;border-bottom:1px solid rgba(255,255,255,.18)\" style-hover=\"color:#DBF68A\">Ihr Projekt mit NeXify besprechen<span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n   <\u002Fdiv>\n   <sc-for list=\"{{ footerGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n    <nav aria-label=\"{{ g.label }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;min-width:0\">\n     <h2 style=\"margin-bottom:12px;font-size:15px;font-weight:500;line-height:1.5;color:#F3F0EA\">{{ g.a }}<span style=\"color:#C4B394\">{{ g.b }}<\u002Fspan><\u002Fh2>\n     <sc-for list=\"{{ g.links }}\" as=\"l\" hint-placeholder-count=\"4\"><a href=\"#\" style=\"display:flex;align-items:center;min-height:48px;font-size:15px;color:#E2DFD8\" style-hover=\"color:#fff\">{{ l }}<\u002Fa><\u002Fsc-for>\n    <\u002Fnav>\n   <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding-block:24px\">\n   <span style=\"margin-right:auto;font-size:13px\">NeXify AI FACTORY B.V. · Chat it. Automate it.<\u002Fspan>\n   <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:12px;min-height:44px;font-size:14px\">TEILEKLAR<span aria-hidden=\"true\" style=\"color:#C4B394\">→<\u002Fspan><\u002Fa>\n   <button type=\"button\" sc-camel-on-click=\"{{ toggleOverview }}\" aria-expanded=\"{{ overviewExpanded }}\" style=\"display:inline-flex;align-items:center;gap:24px;min-height:44px;padding:0;border:0;background:none;font-size:14px;font-weight:500;cursor:pointer\">Seitenübersicht<span aria-hidden=\"true\" style=\"color:#C0EE38;font-size:20px\">{{ overviewSign }}<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ overviewOpen }}\" hint-placeholder-val=\"{{ false }}\">\n   <p style=\"padding-bottom:24px;font-size:13px;color:#B9BBBA\">Alle Seiten dieses Bereichs, nach Themen geordnet<\u002Fp>\n  <\u002Fsc-if>\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px 24px\">\n   <nav aria-label=\"Rechtsdokumente\" style=\"display:flex;flex-wrap:wrap;gap:24px\"><a href=\"NeXify%20Impressum%20Datenschutz.dc.html\" style=\"display:inline-flex;align-items:center;min-height:44px;font-size:13px\">Impressum<\u002Fa><a href=\"NeXify%20Impressum%20Datenschutz.dc.html\" style=\"display:inline-flex;align-items:center;min-height:44px;font-size:13px\">Datenschutz<\u002Fa><\u002Fnav>\n   <button type=\"button\" sc-camel-on-click=\"{{ toggleLegal }}\" aria-expanded=\"{{ legalExpanded }}\" style=\"min-height:44px;padding:0;border:0;background:none;font-size:13px;cursor:pointer\">Hinweise zu den Rechtsdokumenten<\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ legalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n   <div style=\"max-width:70ch;margin-left:auto;padding-block:12px;font-size:13px;line-height:1.65;color:#B9BBBA\"><p>Die Seiten zu Anbieterinformationen und Datenschutz sind direkt erreichbar. Vollständige Pflichtangaben und Rechtstexte stehen noch zur Prüfung und Freigabe.<\u002Fp><p style=\"margin-top:12px\">Eine öffentliche Übersicht der Drittanbieter-Komponenten und ihrer Lizenzen ist noch nicht verfügbar.<\u002Fp><\u002Fdiv>\n  <\u002Fsc-if>\n  <button type=\"button\" style=\"margin-top:32px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:none;font-size:12px;cursor:pointer\"><span aria-hidden=\"true\" style=\"font-size:9px\">▶<\u002Fspan>Fehlerdiagnose-Einstellungen<\u002Fbutton>\n <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  "autoScenes": { "editor": "boolean", "default": true, "tsType": "boolean", "section": "Szenen", "label": "Szenen beim Scrollen automatisch starten" },\n  "autoAdvanceScenes": { "editor": "boolean", "default": true, "tsType": "boolean", "section": "Szenen", "label": "Cues automatisch weiterlaufen" }\n}\">\nconst OFFERS=[\n ['Marke, Text & Website','Ein Auftritt, der zu Ihrem Unternehmen passt und sich auch so liest.',['Positionierung, Seitenstruktur und klare Texte für Ihr Angebot','Eigene Gestaltung, die für Ihr Unternehmen entwickelt wird','Responsive Umsetzung, klarer Anfrageweg und persönliche Übergabe'],'Für Neugründung oder Relaunch. Umfang, Sprachen und Funktionen werden vor dem Start fest vereinbart.','#websites'],\n ['Systeme & Automatisierung','Wiederkehrende Aufgaben laufen geordnet ab, und Ihre gewohnte Arbeitsweise bleibt erhalten.',['Einen konkreten, wiederkehrenden Ablauf vollständig verstehen','Vorhandene Systeme, Daten und Freigaben gezielt verbinden','Fehlerfälle prüfen, Verantwortlichkeiten klären und Bedienung dokumentieren'],'Wir beginnen bewusst mit einem Ablauf. Erst wenn er zuverlässig funktioniert, planen wir den nächsten.','#automatisierung'],\n ['Sichtbarkeit & Kampagne','Damit die richtigen Menschen Sie finden und einen guten Grund haben, sich zu melden.',['Angebot, Zielgruppe und Suchintention präzise herausarbeiten','Landingpage, Inhalte und Werbemittel aus einem visuellen Konzept entwickeln','SEO, GEO, lokale Signale und Auswertung aufeinander abstimmen'],'Werbebudget, Plattformkosten und laufende Betreuung bleiben transparent getrennt.','#leistungen-detail']\n];\nconst PRODUCTS=[\n ['NeX2fly Suite','Ihr persönlicher oder geschäftlicher Arbeitsbereich für Gespräche, Aufgaben, Dokumente und Wissen.','Privat & Business kennenlernen','#nex2fly'],\n ['NeX Agentic AI','Aufgabenbezogene Assistenz und freigegebene Werkzeugarbeit, ergänzt durch AIFly ORACLE zur Koordination.','Agentenarbeit verstehen','#one'],\n ['NeXify API','Der technische Integrationsweg für eigene Anwendungen. Umfang, Zugang und Betriebsbedingungen werden gesondert geklärt.','API-Konzept ansehen','#api'],\n ['TEILEKLAR','Die eigenständige Welt für Fahrzeugteile, Werkstätten und passende Anfragen.','Zum Fahrzeug- und Teilebereich','#teileklar']\n];\nconst CHAT=[\n ['01','Marke & Web','Positionierung, Sprache, Design und Website als überzeugender Auftritt.'],\n ['02','Systeme & KI','Abläufe, Systeme und KI zu einer kontrollierten Arbeitsweise verbinden.'],\n ['03','Ads & Marketing','Angebot, Zielgruppe, Kampagne und Landingpage gemeinsam auf Wirkung ausrichten.']\n];\nconst FOOTER=[\n ['Produkte & ','Arbeitsbereiche',['NeX2fly Suite','NeX Agentic AI','NeXify API','TEILEKLAR','Partner werden']],\n ['Leistungen & ','Zusammenarbeit',['Websites & Markenauftritt','Automatisierung & KI','Apps & Portale','Landingpages & Kampagnen','Preise & Zusammenarbeit']],\n ['NeXify AI ','FACTORY B.V.',['Über NeXify','Kontakt','Anmelden','Registrieren']],\n ['Rechtliches','',['Impressum','Datenschutz','Vertragsgrundlagen','KI-Hinweise','Barrierefreiheit','Datenschutzeinstellungen']]\n];\nconst SPK={pascal:['Pascal','#C4B394','50%','28%'],nex:['NeX','#C0EE38','18%','0%'],oracle:['AIFly ORACLE','#BDC5C9','84%','56%']};\nconst SCENES={\n project:[['pascal',9.7,'Bevor wir über Technik sprechen, schauen wir auf Ihr Vorhaben. Was soll für Ihre Kunden oder Ihr Team einfacher werden? Eine fertige Lösung brauchen Sie dafür noch nicht.'],['nex',7.8,'Ein Beispiel aus Ihrem Alltag hilft: Wo beginnt die Arbeit, welche Informationen werden gebraucht und was soll am Ende vorliegen?'],['oracle',12,'Wir ordnen Ihr Ziel, Ihre vorhandenen Systeme und die offenen Fragen. So wird sichtbar, welcher nächste Schritt sinnvoll ist. Zugangsdaten brauchen Sie für diese erste Beschreibung nicht.'],['pascal',4.9,'Erzählen Sie uns kurz, was Sie verändern möchten. Den passenden Umfang klären wir gemeinsam.']],\n choice:[['nex',9.8,'Möchten Sie Ihr Angebot im Internet verständlich zeigen? Dann ist der Website-Bereich ein guter Einstieg. Dort geht es um Inhalte, Gestaltung und den Weg zur Anfrage.'],['pascal',10.3,'Wenn sich eine Aufgabe ständig wiederholt, schauen wir auf den Ablauf dahinter. Gemeinsam klären wir, welche Schritte sich verbinden lassen und wo Menschen entscheiden sollen.'],['oracle',11.7,'Geht es um Informationen und Zusammenarbeit, kann eine App oder ein Portal der passende Weg sein. Entscheidend ist, was Ihre Kunden oder Ihr Team dort tatsächlich erledigen sollen.'],['pascal',6,'Wählen Sie den Bereich, der zu Ihrem Vorhaben passt. Wenn Sie unsicher sind, helfen wir Ihnen beim Einordnen.']]\n};\nconst R=(window.__resources||{});const IMAGES={project:[R.p0||'media-min/sc-a2.jpg',R.p1||'media-min/sc-a3.jpg',R.p2||'media-min/sc-a6.jpg',R.p3||'media-min/sc-a4.jpg'],choice:[R.c0||'media-min/sc-b1.jpg',R.c1||'media-min/sc-b2.jpg',R.c2||'media-min/sc-b3.jpg',R.c3||'media-min/sc-b4.jpg']};\nconst BOARD=[['Ihr Ziel','Was soll einfacher werden?','#C4B394'],['Ihr Alltag','Wo beginnt die Arbeit?','#C0EE38'],['Offene Fragen','Systeme und nächster Schritt','#BDC5C9']];\nconst PATHS=[['Marke & Web',0],['Systeme & KI',1],['Sichtbarkeit & Wachstum',2]];\nconst CALC=[['hours','Arbeitsaufwand · Stunden'],['rate','Interner Kostensatz · EUR / Stunde'],['ext','Fremdleistungen · EUR'],['over','Gemeinkosten · EUR'],['risk','Risikoreserve · EUR'],['margin','Zielmarge · %']];\nconst SH='inset 0 1px 0 rgba(189,197,201,.16),0 0 0 1px rgba(255,255,255,.04),0 24px 64px -32px rgba(0,0,0,.9)';\nconst SHP='inset 0 1px 0 rgba(189,197,201,.32),inset 1px 0 0 rgba(196,179,148,.12),0 0 0 1px rgba(255,255,255,.06),0 24px 64px -32px rgba(0,0,0,.9)';\nclass Component extends DCLogic {\n state={tall:true,sc:{project:{i:0,el:0,play:false},choice:{i:0,el:0,play:false}},open:0,wide:true,menu:false,chatExpanded:true,pick:-1,chatText:'',note:null,calcOpen:false,overview:false,legal:false,calc:{hours:40,rate:65,ext:400,over:300,risk:250,margin:20}};\n colRef=el=>{\n  if(this._ro){this._ro.disconnect();this._ro=null;}\n  if(!el)return;\n  this._ro=new ResizeObserver(([e])=>{const w=e.contentRect.width>=1120;if(w!==this.state.wide)this.setState({wide:w,menu:w?false:this.state.menu});});\n  this._ro.observe(el);\n };\n componentWillUnmount(){window.removeEventListener('resize',this._vh);if(window.visualViewport)window.visualViewport.removeEventListener('resize',this._vh);if(this._ro)this._ro.disconnect();clearInterval(this._tick);}\n componentDidMount(){try{document.documentElement.lang='de';}catch(e){}this._vh=()=>{const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;const tall=h>=760;if(tall!==this.state.tall)this.setState({tall});};this._vh();window.addEventListener('resize',this._vh);if(window.visualViewport)window.visualViewport.addEventListener('resize',this._vh);this._tick=setInterval(()=>{const s=this.state.sc;let ch=false;const n={...s};for(const k of Object.keys(SCENES)){const v=s[k];if(!v.play)continue;if(this.props.autoAdvanceScenes===false)continue;ch=true;let el=v.el+0.25,i=v.i;if(el>=SCENES[k][i][1]){if(i<SCENES[k].length-1){i++;el=0;}else{n[k]={i,el:0,play:false};continue;}}n[k]={i,el,play:true};}if(ch)this.setState({sc:n});},250);this.syncImgs();\n  this._io=new IntersectionObserver((ents)=>{ents.forEach(e=>{const k=e.target.dataset.scene;if(!k)return;const vis=e.isIntersecting&&e.intersectionRatio>=0.5;this.setState(s=>{const cur=s.sc[k];if(vis&&!cur.play&&!cur._userStopped&&(this.props.autoScenes!==false))return{sc:{...s.sc,[k]:{...cur,play:true,started:true}}};if(!vis&&(cur.play||cur._userStopped))return{sc:{...s.sc,[k]:{...cur,play:false,_userStopped:false}}};return null;});});},{threshold:[0,0.5,1]});\n  [['vorhaben','project'],['leistungen','choice']].forEach(([id,k])=>{const el=document.getElementById(id);if(el){el.dataset.scene=k;this._io.observe(el);}});}\n componentWillUnmount(){if(this._io)this._io.disconnect();if(this._tick)clearInterval(this._tick);}\n componentDidUpdate(){this.syncImgs();}\n vImgRef=(n)=>{this._vimg=n;this.syncImgs();};\n cImgRef=(n)=>{this._cimg=n;this.syncImgs();};\n fade(node,src){if(!node||!src||node.dataset.src===src)return;node.dataset.src=src;const show=()=>{node.src=src;requestAnimationFrame(()=>{node.style.opacity='1';});};if(node.src&&node.complete){node.style.opacity='0';const im=new Image();im.onload=show;im.src=src;}else{show();}}\n syncImgs(){this.fade(this._vimg,IMAGES.project[this.state.sc.project.i]);this.fade(this._cimg,IMAGES.choice[this.state.sc.choice.i]);}\n sceneVals(k){const v=this.state.sc[k],cues=SCENES[k],cur=cues[v.i][0];const set=p=>this.setState(s=>({sc:{...s.sc,[k]:{...s.sc[k],...p}}}));\n  return {img:(IMAGES[k]||[])[v.i]||'',glowX:SPK[cur][2],spotLeft:SPK[cur][3],playLabel:v.play?'Stop':'Start',\n   toggle:()=>set(v.play?{play:false,_userStopped:true}:{play:true,started:true,_userStopped:false,...(v.i===cues.length-1?{i:0,el:0}:{})}),restart:()=>set({i:0,el:0,play:true,started:true,_userStopped:false}),\n   cues:cues.map(([sp,d,text],i)=>({name:SPK[sp][0],color:SPK[sp][1],text,current:i===v.i?'true':'false',bg:i===v.i?'linear-gradient(145deg,rgba(189,197,201,.10),transparent 50%),rgba(30,33,34,.95)':'rgba(30,33,34,.45)',shadow:i===v.i?'inset 0 1px 0 rgba(189,197,201,.3),0 0 0 1px rgba(196,179,148,.28),12px 12px 32px rgba(0,0,0,.35)':'inset 0 0 0 1px rgba(255,255,255,.05)',opacity:i===v.i?1:.62,jump:()=>set({i,el:0})}))};}\n renderVals(){\n  const s=this.state,c=s.calc;\n  const full=c.hours*c.rate+c.ext+c.over+c.risk,m=Math.min(Math.max(c.margin,0),90)/100;\n  const pj=this.sceneVals('project'),chs=this.sceneVals('choice');\n  const pi=s.sc.project.i,ci=s.sc.choice.i,act={0:0,1:1,2:2,3:-1}[ci];\n  pj.board=BOARD.map(([k,v,color],i)=>({k,v,color,opacity:i<=Math.min(pi,2)?1:.35,shift:i===Math.min(pi,2)?'translateX(-6%)':'none'}));\n  chs.paths=PATHS.map(([label,o],i)=>({label,go:()=>this.setState({open:o}),ring:(act===i||act===-1)?'1px solid rgba(192,238,56,.55)':'none',shift:act===i?'translateX(6%)':'none'}));\n  return {\n   project:pj,choice:chs,vImgRef:this.vImgRef,cImgRef:this.cImgRef,chatPin:s.tall?'sticky':'relative',\n   colRef:this.colRef,\n   wide:s.wide,narrow:!s.wide,menuOpen:!s.wide&&s.menu,menuExpanded:s.menu?'true':'false',\n   toggleMenu:()=>this.setState({menu:!s.menu}),closeMenu:()=>this.setState({menu:false}),\n   offers:OFFERS.map(([title,lead,items,caption,href],i)=>({title,lead,items,caption,href,open:s.open===i,expanded:s.open===i?'true':'false',rotate:s.open===i?'rotate(45deg)':'none',shadow:s.open===i?SHP:SH,toggle:()=>this.setState({open:s.open===i?-1:i})})),\n   products:PRODUCTS.map(([title,body,action,href])=>({title,body,action,href})),\n   calcOpen:s.calcOpen,calcCollapsed:!s.calcOpen,calcExpanded:s.calcOpen?'true':'false',calcRotate:s.calcOpen?'rotate(180deg)':'none',toggleCalc:()=>this.setState({calcOpen:!s.calcOpen}),\n   calcFields:CALC.map(([k,label])=>({label,value:c[k],set:e=>{const v=parseFloat(e.target.value);this.setState(p=>({calc:{...p.calc,[k]:isNaN(v)?0:v}}));}})),\n   calcResult:new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(full/(1-m)),\n   chatExpanded:s.chatExpanded,chatExpandedAttr:s.chatExpanded?'true':'false',chatChevron:s.chatExpanded?'none':'rotate(180deg)',chatToggleLabel:s.chatExpanded?'Assistent einklappen':'Assistent öffnen',\n   toggleChat:()=>this.setState({chatExpanded:!s.chatExpanded}),\n   chatOptions:CHAT.map(([num,label,desc],i)=>({num,label,desc,pressed:s.pick===i?'true':'false',bg:s.pick===i?'#242728':'#1D2021',ring:s.pick===i?'inset 0 0 0 1px rgba(192,238,56,.45)':'inset 0 0 0 1px rgba(255,255,255,.07)',pick:()=>this.setState({pick:i,note:{k:label,t:'Beschreiben Sie unten kurz, was sich verändern soll. Danach sehen Sie die passenden Informationen und den Weg zum persönlichen Gespräch.'}})})),\n   hasNote:!!s.note,noteKicker:s.note?s.note.k:'',noteText:s.note?s.note.t:'',\n   chatText:s.chatText,setChatText:e=>this.setState({chatText:e.target.value}),\n   submitChat:e=>{e.preventDefault();const t=s.chatText.trim();this.setState({note:t?{k:'Ihr Vorhaben',t:'Vielen Dank. Wir sortieren Ihre Angaben vor. Für Ziele, Umfang und Entscheidungen meldet sich Pascal persönlich bei Ihnen.'}:{k:'Wobei können wir Ihnen helfen?',t:'Ein paar Sätze reichen für den Einstieg.'}});},\n   footerGroups:FOOTER.map(([a,b,links])=>({a,b,label:a+b,links})),\n   overviewOpen:s.overview,overviewExpanded:s.overview?'true':'false',overviewSign:s.overview?'−':'+',toggleOverview:()=>this.setState({overview:!s.overview}),\n   legalOpen:s.legal,legalExpanded:s.legal?'true':'false',toggleLegal:()=>this.setState({legal:!s.legal})\n  };\n }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
