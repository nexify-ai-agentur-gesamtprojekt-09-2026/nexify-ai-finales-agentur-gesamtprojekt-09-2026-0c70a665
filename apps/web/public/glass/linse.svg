<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
<!-- Verschiebungskarte fuer die Glaskante: Rot = waagerecht, Gruen = senkrecht, Mitte neutral (128). Keine Bildfarbe, nur Daten fuer feDisplacementMap. -->
<defs>
<linearGradient id="x" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ff0000"/><stop offset=".14" stop-color="#800000"/><stop offset=".86" stop-color="#800000"/><stop offset="1" stop-color="#000000"/></linearGradient>
<linearGradient id="y" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00ff00"/><stop offset=".22" stop-color="#008000"/><stop offset=".78" stop-color="#008000"/><stop offset="1" stop-color="#000000"/></linearGradient>
</defs>
<rect width="100" height="100" fill="#000000"/>
<rect width="100" height="100" fill="url(#x)"/>
<rect width="100" height="100" fill="url(#y)" style="mix-blend-mode:screen"/>
</svg>
