  fr: {
    skip: "Aller au contenu", plattform: "Choisir la marque", intern: "Portails", loginZu: "Se connecter en tant que", sprache: "Langue",
    haupt: "Navigation principale", anmelden: "Se connecter",
    l: { nxOne: "NeXify AI one", demos: "Démos", shopMuster: "Boutique", pKunde: "Client", api: "API", wissenshub: "Base de savoir", affiliate: "Affiliation", workspace: "Workspace", posteingang: "Boîte", leitstand: "Poste de pilotage", myadmin: "myADMIN", organisation: "Organisation", ziele: "Objectifs", dokumente: "Documents", abmelden: "Se déconnecter",  pPartner: "Garage", pGutschein: "Bon", leistungen: "Prestations", fertig: "Solutions prêtes", preise: "Tarifs & calculateur", prozess: "Déroulé", referenzen: "Références",

      kundenportal: "Portail client", partnerportal: "Portail partenaire", gutschein: "Utiliser le bon", konto: "Mon compte",

  }
};

class Component extends DCLogic {
  state = { eigenerMarkt: null, menu: false };

  componentWillUnmount() { if (this._onResize) window.removeEventListener("resize", this._onResize); }

  componentDidMount() {
    this._nxMarkt = (e) => { if (e.detail && e.detail.quelle !== "header") this.setState({ eigenerMarkt: e.detail.code }); };
    window.addEventListener("nx:markt", this._nxMarkt);
    try { const g = window.localStorage.getItem("nx-market"); if (g && MAERKTE[g]) { this.setState({ eigenerMarkt: g }); document.documentElement.lang = MAERKTE[g][1]; } } catch (e) {}
    if (typeof window !== "undefined") {
      this._w = window.innerWidth;
      this._onResize = () => { const w = window.innerWidth; if (Math.abs(w - (this._w || 0)) > 8) { this._w = w; this.forceUpdate(); } };
      window.addEventListener("resize", this._onResize);
      this.forceUpdate();
    }
    if (this.props.onMarket || typeof window === "undefined") return;
    try {
      const gespeichert = window.localStorage.getItem("nx-market");
      if (gespeichert && MAERKTE[gespeichert]) this.setState({ eigenerMarkt: gespeichert });
    } catch (e) { /* Speicher gesperrt – Vorgabe bleibt */ }
  }

  renderVals() {
    const self = this;
    const code = this.state.eigenerMarkt || this.props.market || "de-DE";
    const m0 = MAERKTE[code] || MAERKTE["de-DE"];
    const lang = this.state.eigenerMarkt ? m0[1] : (this.props.lang || m0[1]);
    const t = T[lang] || T.de;
    const active = this.props.active || "";
    const marke = this.props.marke || "cloud";
    const navSatz = this.props.nav || (marke === "shop" ? "shop" : "cloud");
    const variante = this.props.variante || "voll";
    const rolle = this.props.rolle || "";

    const waehleSprache = (ziel) => () => {
      const treffer = Object.keys(MAERKTE).filter((k) => MAERKTE[k][1] === ziel);
      const neu = treffer.indexOf(code) !== -1 ? code : treffer[0];
      if (self.props.onMarket) self.props.onMarket(neu, ziel);
      else {
        self.setState({ eigenerMarkt: neu });
        try { window.localStorage.setItem("nx-market", neu); window.dispatchEvent(new CustomEvent("nx:markt", { detail: { code: neu, quelle: "header" } })); document.documentElement.lang = ziel; } catch (e) { /* Speicher gesperrt */ }
      }
    };

    const link = (schluessel, href) => {
      const an = schluessel === active;
      return { label: t.l[schluessel] || schluessel, href: href, current: an ? "page" : "false",
        bg: an ? "#D7FA50" : "transparent", fg: an ? "#FFFFFF" : "#FFFFFF", weight: "500" };
    };

    const istShop = marke === "shop";
    const ctaSchluessel = this.props.cta || (istShop ? "teile" : "beratung");

    return {
      tSkip: t.skip, tPlattform: t.plattform, tIntern: t.intern, tSprache: t.sprache, tHaupt: t.haupt, tAnmelden: t.anmelden,
      skipHref: this.props.inhaltId || "#inhalt",

      marken: [
        { label: "NeXify AI", href: CLOUD, current: marke === "cloud" ? "page" : "false",
          bg: marke === "cloud" ? "rgba(215,250,80,.16)" : "transparent",
          fg: marke === "cloud" ? "#D7FA50" : "#BCC1BD", weight: marke === "cloud" ? "600" : "400",
          dot: marke === "cloud" ? "#D7FA50" : "#4A4F4C", radius: "99px",
          glanz: "none" },
        { label: "TEILEKLAR", href: SHOP, current: istShop ? "page" : "false",
          bg: istShop ? "rgba(215,250,80,.16)" : "transparent",
          fg: istShop ? "#D7FA50" : "#BCC1BD", weight: istShop ? "600" : "400",
          dot: istShop ? "#D7FA50" : "#4A4F4C", radius: "3px",
          glanz: "none" }
      ],
      portale: PORTALE.map(([k, href, akt], i) => {
        const an = akt === active;
        return { label: t.l[k], href: href, current: an ? "page" : "false", sep: i === 0 ? "transparent" : "#4A4F4C",
          bg: an ? "rgba(215,250,80,.1)" : "transparent", fg: an ? "#D7FA50" : "#FFFFFF" };
      }),
      tLoginZu: t.loginZu,

      marktLabel: m0[0] + " · " + m0[2],
      sprachen: ["de", "nl", "fr"].map((c) => {
        const an = c === lang;
        return { code: c, pressed: an ? "true" : "false", pick: waehleSprache(c),
          bg: an ? "rgba(215,250,80,.1)" : "transparent", fg: an ? "#D7FA50" : "#BCC1BD",
          border: an ? "rgba(215,250,80,.55)" : "#4A4F4C" };
      }),

      zeigtHaupt: variante === "voll",
      istCloud: !istShop, istShop: istShop,
      markeName: istShop ? "TEILEKLAR" : "NeXify AI",
      markeHref: istShop ? SHOP : CLOUD,
      kontext: this.props.kontext || "",

      navSichtbar: (NAV[navSatz] || NAV.cloud).map(([k, href]) => link(k, href)),
      navDisplay: (this._w || 1440) < 1080 ? "none" : "flex",
      menuBtnDisplay: (this._w || 1440) < 1080 ? "grid" : "none",
      menuOpen: this.state.menu && (this._w || 1440) < 1080,
      menuExpanded: this.state.menu ? "true" : "false",
      toggleMenu: () => this.setState((s) => ({ menu: !s.menu })),

      angemeldet: !!this.props.angemeldet,
      abgemeldet: !this.props.angemeldet,
      initialen: this.props.initialen || "EM",
      rolleLabel: t.rollen[rolle] || t.rollen.unternehmen,
      tAbmelden: t.l.abmelden, abmeldenHref: this.props.abmeldenHref || "Anmeldung.dc.html?abgemeldet=1",
      kontoHref: rolle === "intern" ? "myADMIN v2.dc.html" : rolle === "werkstatt" ? "Partnerportal.dc.html" : rolle === "autofahrer" ? "Konto.dc.html" : "Kundenportal.dc.html",

      zeigtCta: this.props.cta !== "keine",
      ctaLabel: t.cta[ctaSchluessel] || t.cta.beratung,
      ctaHref: this.props.ctaHref || (istShop ? SHOP + "#fahrzeug" : CLOUD + "#kontakt")
    };
  }
}

</script>
