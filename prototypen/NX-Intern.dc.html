<meta name="description" content="Seite">
  </helmet>
<nav aria-label="Intern" style="position:relative;z-index:60;box-sizing:border-box;display:flex;align-items:center;gap:16px;min-height:56px;padding:0 24px;border-bottom:1px solid #363A38;background:#1E2220;color:#FFFFFF;font-family:Geist,Helvetica,Arial,sans-serif">
  <a href="NeXify Workspace.dc.html" aria-label="NeXify Workspace" style="display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;min-height:44px;padding:0 8px;margin-left:-8px;color:#FFFFFF;text-decoration:none" style-focus="outline:2px solid #D7FA50;outline-offset:-2px">
    <img src="assets/nexify-ai/nexify-ai-signet.svg" alt="" aria-hidden="true" style="display:block;width:18px;height:18px" />
    <span style="font-size:14px;font-weight:700;letter-spacing:-.03em">Ne<span style="color:#D7FA50">X</span>ify</span>
    <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#9CA29E">intern</span>
  </a>
  <span aria-hidden="true" style="width:1px;height:24px;flex:0 0 auto;background:#363A38"></span>
  <sc-if value="{{ breit }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;padding:0 4px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#363A38 transparent">
      <sc-for list="{{ eintraege }}" as="e" hint-placeholder-count="8">
        <a href="{{ e.href }}" aria-current="{{ e.current }}" style="display:inline-flex;align-items:center;flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:8px;background:{{ e.bg }};color:{{ e.fg }};font-size:13px;font-weight:{{ e.weight }};text-decoration:none;white-space:nowrap;transition:background .2s ease,color .2s ease" style-hover="background:#303634;color:#FFFFFF" style-focus="outline:2px solid #D7FA50;outline-offset:-2px">{{ e.label }}</a>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ schmal }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;flex:1 1 auto;min-width:0;display:flex">
      <button onClick="{{ menuUmschalten }}" aria-expanded="{{ menuOffen }}" aria-controls="nx-intern-menu" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;padding:0 12px;background:linear-gradient(180deg,#303634 0%,#292D2B 100%);border:1px solid rgba(255,255,255,.08);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 24px -16px rgba(0,0,0,.8);color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer" style-focus="outline:2px solid #D7FA50;outline-offset:-2px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ aktivLabel }}</span><span aria-hidden="true" style="color:#9CA29E">▾</span></button>
      <sc-if value="{{ menuOffen }}" hint-placeholder-val="{{ false }}">
        <div id="nx-intern-menu" role="menu" style="position:absolute;top:48px;left:0;z-index:70;display:grid;gap:4px;min-width:220px;padding:8px;background:linear-gradient(180deg,#303634 0%,#262A28 100%);border:1px solid rgba(255,255,255,.08);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 28px 56px -32px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.25)">
          <sc-for list="{{ eintraege }}" as="e" hint-placeholder-count="8">
            <a role="menuitem" href="{{ e.href }}" aria-current="{{ e.current }}" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;background:{{ e.bg }};color:{{ e.fg }};font-size:14px;font-weight:{{ e.weight }};text-decoration:none" style-hover="background:#363A38;color:#FFFFFF" style-focus="outline:2px solid #D7FA50;outline-offset:-2px">{{ e.label }}</a>
          </sc-for>
        </div>
      </sc-if>
    </div>

  <span style="display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;font-family:'Geist Mono',monospace;font-size:12px;color:#BCC1BD;white-space:nowrap"><span aria-hidden="true" style="display:block;width:8px;height:8px;border-radius:999px;background:{{ statusFarbe }}"></span>{{ statusText }}</span>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:48},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;workspace&quot;,&quot;posteingang&quot;,&quot;leitstand&quot;,&quot;myadmin&quot;,&quot;organisation&quot;,&quot;ziele&quot;,&quot;architektur&quot;,&quot;dokumente&quot;,&quot;start&quot;],&quot;default&quot;:&quot;workspace&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vorschau&quot;,&quot;live&quot;,&quot;gestoert&quot;],&quot;default&quot;:&quot;vorschau&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Betrieb&quot;}}">
// NX-Intern – die EINZIGE interne Navigation. Auf jeder internen Seite oben, aktive Seite markiert (SOLL-Beschreibung § 6.3).
const SEITEN = [
  ["workspace", "Workspace", "NeXify Workspace.dc.html"], ["posteingang", "Posteingang", "NeXify Posteingang.dc.html"], ["leitstand", "Leitstand", "NeXify Leitstand.dc.html"],
  ["myadmin", "myADMIN", "myADMIN v2.dc.html"], ["dokumente", "Geschäftsdokumente", "Geschaeftsdokumente-Vorlagen.dc.html"]
];
class Component extends DCLogic {
  state = { menu: false, w: typeof window !== "undefined" ? window.innerWidth : 1440 };
  componentDidMount() { this._r = () => { const w = window.innerWidth; if (Math.abs(w - this.state.w) > 8) this.setState({ w, menu: false }); }; window.addEventListener("resize", this._r); }
  componentWillUnmount() { window.removeEventListener("resize", this._r); }
  renderVals() {
    const aktiv = this.props.active || "";
    const status = this.props.status || "vorschau";
    const breit = this.state.w >= 1200;
    const akt = SEITEN.find((s) => s[0] === aktiv);
    return {
      breit, schmal: !breit, menuOffen: this.state.menu, menuUmschalten: () => this.setState((s) => ({ menu: !s.menu })),
      aktivLabel: akt ? akt[1] : "Bereiche",
      eintraege: SEITEN.map(([id, label, href]) => { const an = id === aktiv; return { label, href, current: an ? "page" : "false", bg: an ? "#303634" : "transparent", fg: an ? "#FFFFFF" : "#BCC1BD", weight: an ? "600" : "500" }; }),
      statusFarbe: status === "live" ? "#6FE3CF" : status === "gestoert" ? "#FF8A7A" : "#FFC24A",
      statusText: status === "live" ? "Live" : status === "gestoert" ? "Störung" : "Vorschau"
    };
  }
}
</script>
