# NeXify finale Agentur-Gesamtloesung · GitLab CI
# Breitere Pflichtgates (Masterprompt §15). Alle Jobs sind hermetisch (nur Repo + Standard-Images).
stages: [pruefen, jeff]

ds-audit:
  stage: pruefen
  image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  script:
    - node tools/ds-audit-cli.js
    - test "$(node tools/ds-audit-cli.js | grep -c '^Fehler\t')" = "0"

manifest:
  stage: pruefen
  image: alpine:3.20
  script:
    - cd prototypen && sha256sum -c MANIFEST.sha256

json-konfig:
  stage: pruefen
  image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  script:
    - node -e "const fs=require('fs'),p=require('path');(function w(d){for(const f of fs.readdirSync(d)){const x=p.join(d,f);if(fs.statSync(x).isDirectory())w(x);else if(x.endsWith('.json'))JSON.parse(fs.readFileSync(x,'utf8'))}})('config')"
    - echo "alle config/*.json gueltig"

python-tests:
  stage: pruefen
  image: python:3.12
  script:
    - python3 -m unittest discover -s tests -p "test_github_event_inbox.py" -q

# Python 3.12 + Node 22 in one hermetic job. The previous node image only had
# Python 3.11, so the pinned Pillow 12.3.0 wheels and generated public data
# were unavailable. This keeps CI aligned with the local/GitHub runtime.
.ci-python312-node22: &ci-python312-node22
  image: python:3.12-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git xz-utils
    - curl -fsSL https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz -o /tmp/node.tar.xz
    - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    - node --version
    - python3 -m pip install --only-binary=:all: --no-deps --require-hashes --requirement requirements-image.txt
    - npm install --global --ignore-scripts pnpm@12.15.0
    - pnpm install --frozen-lockfile --ignore-scripts
    - node apps/site/scripts/generate-public-data.mjs

runtime-tests:
  <<: *ci-python312-node22
  stage: pruefen
  script:
    - node --test tests/gesundheit.test.mjs
    - python3 -m unittest discover -s tests -q

node-syntax:
  stage: pruefen
  image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  script:
    - |
      fail=0
      for f in tools/*.mjs tools/*.js; do node --check "$f" || fail=1; done
      exit $fail

arch-regeln:
  <<: *ci-python312-node22
  stage: pruefen
  script:
    - bash scripts/check-arch.sh

secret-muster:
  stage: pruefen
  image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  script:
    - |
      PAT='sk-[A-Za-z0-9]{40,}|sk-or-v1-[a-f0-9]{64}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|glpat-[A-Za-z0-9_-]{20,}'
      if git grep -I -l -E "$PAT" -- config tools packages apps docs .github .gitlab-ci.yml; then
        echo "Geheimnis-Muster gefunden; Werte werden nicht protokolliert"; exit 1
      else
        result=$?
        test "$result" = 1 || exit "$result"
      fi
      echo "keine Geheimnis-Muster"

jeff-gate:
  stage: jeff
  image: python:3.12-alpine
  needs: ["ds-audit", "manifest", "json-konfig", "python-tests", "runtime-tests", "node-syntax", "arch-regeln", "secret-muster"]
  # Provider credentials belong only to a protected trusted controller. MR head
  # jobs do not receive them; a separate exact-commit review is required to merge.
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - python3 tools/jeff-gate.py --was "DS-Audit, Manifest-Echtheit, JSON-Konfig, Python-Tests, lokale Runtime-/Vorschautests, Node-Syntax, Architektur-Regeln und Geheimnis-Muster gruen" --risiko "niedrig (nur Pruefschranken, nichts deployt)" --rollback "Commit zuruecknehmen"

slack:
  stage: jeff
  image: curlimages/curl:latest
  needs: ["jeff-gate"]
  rules:
    - if: '$NX_ENABLE_NOTIFICATIONS == "1" && $SLACK_WEBHOOK != null && $SLACK_WEBHOOK != ""'
      when: always
  script:
    - |
      curl -sS -X POST -H 'Content-Type: application/json' \
        --data "{\"text\":\"${CI_PROJECT_PATH} · ${CI_COMMIT_REF_NAME} · ${CI_PIPELINE_STATUS} · ${CI_PIPELINE_URL}\"}" \
        "$SLACK_WEBHOOK"

model-catalog:
  stage: pruefen
  image: python:3.12-slim@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
  script:
    - python3 tools/automation/ai_review.py catalog --config config/automation.json --output model-catalog.json
  artifacts:
    paths: [model-catalog.json]
    expire_in: 7 days

ai-review-trusted:
  stage: jeff
  image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  needs: [runtime-tests, arch-regeln, secret-muster, model-catalog]
  rules:
    - if: '$NX_AI_REVIEW_TRUSTED == "1" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - |
      set -euo pipefail
      test "${NX_REVIEW_BASE_SHA:-}" != ""
      test "${NX_REVIEW_HEAD_SHA:-}" != ""
      [[ "$NX_REVIEW_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
      [[ "$NX_REVIEW_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
      git fetch --no-tags origin "$NX_REVIEW_BASE_SHA" "$NX_REVIEW_HEAD_SHA"
      python3 tools/automation/ai_review.py review --config config/automation.json --repository . --base-sha "$NX_REVIEW_BASE_SHA" --head-sha "$NX_REVIEW_HEAD_SHA" --output ai-review.json
  artifacts:
    when: always
    paths: [ai-review.json]
    expire_in: 7 days
