name: Slack

on:
  push:
    branches: [main]
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Slack-Benachrichtigung (nur mit Webhook)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "kein Slack-Webhook konfiguriert"; exit 0; fi
          event="${{ github.event_name }}"
          ref="${{ github.ref }}"
          text="${{ github.repository }} · ${event} · ${ref}"
          case "$event" in
            issues)
              text="$text · #${{ github.event.issue.number }} · ${{ github.event.action }}"
              ;;
            pull_request)
              text="$text · #${{ github.event.pull_request.number }} · ${{ github.event.action }}"
              ;;
          esac
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg text "$text" '{text:$text}')" "$SLACK_WEBHOOK_URL"
