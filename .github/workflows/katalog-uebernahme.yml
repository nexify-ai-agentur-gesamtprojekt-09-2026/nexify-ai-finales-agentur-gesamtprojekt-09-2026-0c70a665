name: Katalog-Übernahme teileklar.shop
# Liest den Katalog über die öffentliche Schnittstelle von teileklar.shop und schreibt ihn in den Namensraum
# nexify_teileklar_shop_v1 der bestehenden Shop-Datenbank (apps/shop-api/transfer_public_catalog.py).
# Läuft nur in der GitHub-Umgebung "katalog-produktion": Dort liegt das einzige Geheimnis
# (CATALOG_TARGET_MONGO_URL = derselbe Wert wie MONGODB_URI im Vercel-Projekt), und dort gibt der Inhaber
# jeden Lauf per "Review deployments" frei (Required reviewers muss gesetzt sein). Ohne Geheimnis endet der Lauf vor
# jedem Lesen und Schreiben.
# Bericht: docs/04-betrieb/katalog-uebernahme-2026-11-16.md
# Kein automatischer Auslöser: nur manueller Start, und der Job läuft nur auf main (geschützter, geprüfter Stand).
# Ein Push auf einen Feature-Zweig kann die Produktion damit nie verändern (Befund PR #214, 16.11.2026).
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: katalog-uebernahme
  cancel-in-progress: false
jobs:
  uebernahme:
    if: >-
      github.repository == 'nexify-ai-agentur-gesamtprojekt-09-2026/nexify-ai-finales-agentur-gesamtprojekt-09-2026-0c70a665' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: katalog-produktion
    env:
      CATALOG_TARGET_DB_NAME: nexify_teileklar_shop_v1
      CONTRACT: apps/shop-api/contracts/katalog-uebernahme-teileklar-2026-11-16.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Abhängigkeiten (gesperrt)
        run: |
          python -m pip install --only-binary=:all: --require-hashes --requirement apps/shop-api/requirements.txt
      - name: Ziel hinterlegt?
        env:
          CATALOG_TARGET_MONGO_URL: ${{ secrets.CATALOG_TARGET_MONGO_URL }}
        run: |
          if [ -z "$CATALOG_TARGET_MONGO_URL" ]; then
            echo "::error::CATALOG_TARGET_MONGO_URL fehlt in der Umgebung katalog-produktion (Schritt 2 im Bericht). Nichts gelesen, nichts geschrieben."
            exit 3
          fi
      - name: Vorher (öffentlich)
        run: curl -sS -m 30 https://nexifyai.de/api/shop/status | tee vorher-status.json
      - name: Trockenlauf (schreibt nichts)
        env:
          CATALOG_TARGET_MONGO_URL: ${{ secrets.CATALOG_TARGET_MONGO_URL }}
        run: python apps/shop-api/transfer_public_catalog.py --log lauf.jsonl --report trocken-bericht.json
      - name: Lauf (schreibt bei vollständiger Gleichheit)
        env:
          CATALOG_TARGET_MONGO_URL: ${{ secrets.CATALOG_TARGET_MONGO_URL }}
        run: python apps/shop-api/transfer_public_catalog.py --log lauf.jsonl --apply --publication-contract "$CONTRACT" --report lauf-bericht.json --snapshot-out quelle.json
      - name: Abnahme an nexifyai.de
        run: |
          published=$(python -c "import json;print(json.load(open('lauf-bericht.json'))['report']['published'])")
          python apps/shop-api/tools_accept_public_catalog.py --base https://nexifyai.de --snapshot quelle.json --report abnahme.json --min-published "$published"
      - name: Belege sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: katalog-uebernahme-${{ github.run_id }}
          path: |
            vorher-status.json
            lauf.jsonl
            trocken-bericht.json
            lauf-bericht.json
            abnahme.json
          if-no-files-found: ignore
          retention-days: 90
