name: Bound AI review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    # Forks receive the ordinary credential-free CI, never this provider job.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ai-review
    steps:
      # Execute only the trusted target commit; never checkout/build the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch objects without executing proposed source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
      - name: One bounded OpenRouter review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/automation/ai_review.py review
          --config config/automation.json --repository .
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          --output "$RUNNER_TEMP/ai-review.json"
      - name: Store advisory result, never execute proposed patches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ai-review.json
          if-no-files-found: warn
          retention-days: 7
