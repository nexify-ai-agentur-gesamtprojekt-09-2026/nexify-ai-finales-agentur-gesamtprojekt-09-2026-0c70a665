name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit, behavior, integrity and architecture
        run: make check && make test && make check-arch
  postgres-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: nx_foundation
        options: >-
          --health-cmd "pg_isready -U postgres -d nx_foundation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Repeat migration and real principal/tenant counterexamples
        env:
          DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/foundation/test.sh "$DATABASE_CONTAINER" nx_foundation
  openapi-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --requirement requirements-contract.txt
      - run: python -m openapi_spec_validator docs/contracts/factory.openapi.json
  next-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm install --global --ignore-scripts pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @nexify/web test:auth
      - run: pnpm --filter @nexify/web build
      - run: pnpm --filter @nexify/web typecheck
