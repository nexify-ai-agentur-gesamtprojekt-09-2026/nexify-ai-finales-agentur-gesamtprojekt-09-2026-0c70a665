name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trust only this checked-out workspace in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Install locked workspace dependencies for module-aware architecture checks
        run: |
          npm install --global --ignore-scripts pnpm@12.15.0
          pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the explicitly pinned local image-batch test runtime
        run: python -m pip install --only-binary=:all: --no-deps --require-hashes --requirement requirements-image.txt
      - name: Generate the source-bound public page snapshot
        run: node apps/site/scripts/generate-public-data.mjs
      - name: Audit, behavior, integrity and architecture
        run: make check && make test && make check-arch
  postgres-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: nx_foundation
        options: >-
          --health-cmd "pg_isready -U postgres -d nx_foundation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Repeat migration and real principal/tenant counterexamples
        env:
          DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker --host=unix:///var/run/docker.sock rename "$DATABASE_CONTAINER" onboarding-postgres
          bash db/foundation/test.sh onboarding-postgres nx_foundation
  openapi-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --requirement requirements-contract.txt
      - run: python -m openapi_spec_validator docs/contracts/factory.openapi.json
  next-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm install --global --ignore-scripts pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @nexify/web test:auth
      - run: pnpm --filter @nexify/web build
      - run: pnpm --filter @nexify/web typecheck

  react-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm install --global --ignore-scripts pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:agent
      - run: pnpm typecheck:agent
      - run: pnpm --filter @nexify/site test
      - run: pnpm --filter @nexify/site typecheck
      - run: pnpm --filter @nexify/site build
      - run: python3 tools/site_release.py build --input apps/site/dist --output .local/releases
      - name: Retain the portable site for the same-release backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-site-${{ github.sha }}
          path: .local/releases/
          if-no-files-found: error
          retention-days: 14
