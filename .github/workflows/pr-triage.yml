name: PR-Triage

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label und Größenklasse setzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ADD: ${{ github.event.pull_request.additions }}
          DEL: ${{ github.event.pull_request.deletions }}
        run: |
          set -euo pipefail
          total=$((ADD + DEL))
          size="xs"
          if [ "$total" -gt 800 ]; then size="xl"
          elif [ "$total" -gt 400 ]; then size="l"
          elif [ "$total" -gt 100 ]; then size="m"
          elif [ "$total" -gt 20 ]; then size="s"; fi
          payload=$(printf '%s\n' "pr" "size/$size" | jq -R . | jq -s .)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$NUMBER/labels" -d "$payload"
